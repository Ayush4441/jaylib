  # ============================================
  # macOS builds
  # ============================================
  build-mac-x86_64:
    runs-on: macos-13
    env:
      MACOSX_DEPLOYMENT_TARGET: '10.14'

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Build raylib (x86_64)
        run: |
          cd raylib
          mkdir build && cd build
          cmake -DBUILD_EXAMPLES=OFF -DCMAKE_OSX_ARCHITECTURES="x86_64" -DCUSTOMIZE_BUILD=ON -DSUPPORT_FILEFORMAT_JPG=ON -DSUPPORT_FILEFORMAT_FLAC=ON -DWITH_PIC=ON -DCMAKE_BUILD_TYPE=Release .. 
          make -j$(sysctl -n hw.ncpu)
          sudo make install

      - name: Build jaylib
        env:
          RAYLIB_PLATFORM: macosx-x86_64
        run: |
          ./build-java. sh
          ./build-native.sh

      - name: Upload jar
