name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  RAYLIB_VERSION: 5.5.0-0

jobs:
  # ============================================
  # Linux x86_64 builds
  # ============================================
  build-linux-x64-x11:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Build raylib (X11)
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev mesa-common-dev libx11-dev libxrandr-dev libxi-dev xorg-dev libgl1-mesa-dev libglu1-mesa-dev
          cd raylib
          mkdir build && cd build
          cmake -DBUILD_EXAMPLES=OFF -DCUSTOMIZE_BUILD=ON -DSUPPORT_FILEFORMAT_JPG=ON -DSUPPORT_FILEFORMAT_FLAC=ON -DWITH_PIC=ON -DUSE_WAYLAND=OFF -DCMAKE_BUILD_TYPE=Release .. 
          make -j$(nproc)
          sudo make install

      - name: Build jaylib
        env:
          RAYLIB_PLATFORM: linux-x86_64-x11
        run: |
          ./build-java.sh
          ./build-native.sh
          ./build-docs.sh

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: jar-linux-x64-x11
          path: . /*. jar

  build-linux-x64-wayland:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Build raylib (Wayland)
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev mesa-common-dev libwayland-dev libxkbcommon-dev wayland-protocols libwayland-egl1-mesa libgl1-mesa-dev libglu1-mesa-dev libegl1-mesa-dev
          cd raylib
          mkdir build && cd build
          cmake -DBUILD_EXAMPLES=OFF -DCUSTOMIZE_BUILD=ON -DSUPPORT_FILEFORMAT_JPG=ON -DSUPPORT_FILEFORMAT_FLAC=ON -DWITH_PIC=ON -DUSE_WAYLAND=ON -DCMAKE_BUILD_TYPE=Release .. 
          make -j$(nproc)
          sudo make install

      - name: Build jaylib
        env:
          RAYLIB_PLATFORM: linux-x86_64-wayland
        run: |
          ./build-java.sh
          ./build-native.sh

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: jar-linux-x64-wayland
          path: . /*.jar

  build-linux-x64-drm:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Build raylib (DRM)
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev mesa-common-dev libdrm-dev libgbm-dev libegl1-mesa-dev libgl1-mesa-dev
          cd raylib
          mkdir build && cd build
          cmake -DBUILD_EXAMPLES=OFF -DCUSTOMIZE_BUILD=ON -DSUPPORT_FILEFORMAT_JPG=ON -DSUPPORT_FILEFORMAT_FLAC=ON -DWITH_PIC=ON -DPLATFORM=DRM -DCMAKE_BUILD_TYPE=Release .. 
          make -j$(nproc)
          sudo make install

      - name: Build jaylib
        env:
          RAYLIB_PLATFORM: linux-x86_64-drm
        run: |
          ./build-java.sh
          ./build-native.sh

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: jar-linux-x64-drm
          path: ./*.jar

  # ============================================
  # Linux x86 (32-bit) builds
  # ============================================
  build-linux-x86-x11:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Set up i386 cross-compilation
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib
          sudo apt-get install -y libasound2-dev:i386 libx11-dev:i386 libxrandr-dev:i386 libxi-dev:i386 libgl1-mesa-dev:i386 libglu1-mesa-dev:i386

      - name: Build raylib (x86, X11)
        run: |
          cd raylib
          mkdir build && cd build
          cmake -DBUILD_EXAMPLES=OFF -DCUSTOMIZE_BUILD=ON -DSUPPORT_FILEFORMAT_JPG=ON -DSUPPORT_FILEFORMAT_FLAC=ON -DWITH_PIC=ON -DUSE_WAYLAND=OFF -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-m32" -DCMAKE_CXX_FLAGS="-m32" ..
          make -j$(nproc)
          sudo make install

      - name: Build jaylib
        env:
          RAYLIB_PLATFORM: linux-x86-x11
          CFLAGS: -m32
          CXXFLAGS: -m32
        run: |
          ./build-java.sh
          ./build-native.sh

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: jar-linux-x86-x11
          path: . /*.jar

  # ============================================
  # Linux ARM64 builds
  # ============================================
  build-linux-arm64-x11:
    runs-on: ubuntu-22. 04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Set up ARM64 cross-compilation
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          sudo dpkg --add-architecture arm64
          sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
          sudo bash -c 'cat > /etc/apt/sources.list. d/arm64.list << EOF
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse
          EOF'
          sudo apt-get update
          sudo apt-get install -y libasound2-dev:arm64 libx11-dev:arm64 libxrandr-dev:arm64 libxi-dev:arm64 libgl1-mesa-dev:arm64 libglu1-mesa-dev:arm64

      - name: Build raylib (ARM64, X11)
        run: |
          cd raylib
          mkdir build && cd build
          cmake -DBUILD_EXAMPLES=OFF -DCUSTOMIZE_BUILD=ON -DSUPPORT_FILEFORMAT_JPG=ON -DSUPPORT_FILEFORMAT_FLAC=ON -DWITH_PIC=ON -DUSE_WAYLAND=OFF -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_FIND_ROOT_PATH=/usr/aarch64-linux-gnu \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY .. 
          make -j$(nproc)
          sudo make install

      - name: Build jaylib
        env:
          RAYLIB_PLATFORM: linux-arm64-x11
          CC: aarch64-linux-gnu-gcc
          CXX: aarch64-linux-gnu-g++
        run: |
          ./build-java.sh
          ./build-native.sh

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: jar-linux-arm64-x11
          path: ./*.jar

