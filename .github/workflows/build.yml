  # ============================================
  # Windows x86_64 build
  # ============================================
  build-windows-x64:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build raylib
        run: |
          cd raylib
          mkdir build
          cd build
          cmake -DBUILD_EXAMPLES=OFF -DCUSTOMIZE_BUILD=ON -DSUPPORT_FILEFORMAT_JPG=ON -DSUPPORT_FILEFORMAT_FLAC=ON -DWITH_PIC=ON -DCMAKE_BUILD_TYPE=Release -A x64 .. 
          msbuild raylib.sln /target:raylib /property:Configuration=Release /property:Platform=x64
          copy raylib\Release\raylib.lib . .\.. 
          cd ..\..
        shell: cmd

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build jaylib
        env:
          RAYLIB_PLATFORM: windows-x86_64
        run: |
          build-windows. bat
        shell: cmd

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: jar-windows-x64
          path: ./*.jar

