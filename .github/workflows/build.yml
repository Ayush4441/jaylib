          arch: arm64

      - name: Build jaylib
        env:
          RAYLIB_PLATFORM: windows-arm64
        run: |
          build-windows.bat
        shell: cmd

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: jar-windows-arm64
          path: . /*.jar

  # ============================================
  # Combine all artifacts
  # ============================================
  combine-artifacts:
    needs: 
      - build-linux-x64-x11
      - build-linux-x64-wayland
      - build-linux-x64-drm
      - build-linux-x86-x11
      - build-linux-arm64-x11
      - build-linux-arm64-wayland
      - build-linux-arm64-drm
      - build-linux-armhf-x11
      - build-linux-armhf-drm
      - build-mac-x86_64
      - build-mac-arm64
      - build-mac-universal
      - build-windows-x64
      - build-windows-x86
      - build-windows-arm64
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: ls -R artifacts

      - name: Combine JARs
        run: |
          mkdir -p combined
          find artifacts -name "*. jar" -exec cp {} combined/ \;
          ls -la combined/

      - name: Upload combined artifacts
        uses: actions/upload-artifact@v4
        with:
          name: all-platform-jars
          path: combined/*. jar
